<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Host View — Process Eiffel Tower Challenge</title>
  <style>
    :root {
      --purple: #7C3AED;
      --gold: #FFD700;
      --gold-dark: #B8860B;
      --bg: #ffffff;
      --card: #f3f0ff;
      --border: #e5e0ff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: #1e1b4b;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 900;
      color: #7C3AED;
      letter-spacing: 3px;
    }
    header p { color: #6b7280; font-size: .85rem; margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto 28px;
    }
    @media (max-width: 700px) { .grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }

    .team-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 14px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: box-shadow .3s;
      position: relative;
    }
    .team-card.leader {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(255,215,0,.25);
    }
    .rank-badge {
      font-size: 1.2rem;
      position: absolute;
      top: 10px;
      right: 12px;
    }
    .team-name {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
    }
    .team-pts {
      font-size: 1.5rem;
      font-weight: 900;
      color: #7C3AED;
    }
    .progress-wrap {
      width: 100%;
      background: #e5e0ff;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width .8s ease;
    }
    .progress-pct {
      font-size: .75rem;
      color: #6b7280;
      align-self: flex-end;
    }

    /* Mini tower SVG styles */
    .tower-svg { width: 100%; max-width: 100px; height: auto; }
    .tower-svg .ts { transition: all .6s ease; }
    .tower-svg .ts rect,
    .tower-svg .ts polygon,
    .tower-svg .ts circle { fill: #e5e0ff; stroke: #c4b5fd; stroke-width: 1; transition: fill .6s, stroke .6s; }
    .tower-svg .ts line { stroke: #c4b5fd; fill: none; transition: stroke .6s; }
    .tower-svg .ts path { fill: none; stroke: #c4b5fd; stroke-width: 5; transition: stroke .6s; }

    .tower-svg .ts.lit rect,
    .tower-svg .ts.lit polygon,
    .tower-svg .ts.lit circle { fill: var(--gold) !important; stroke: var(--gold-dark) !important; filter: drop-shadow(0 0 4px rgba(255,200,0,.8)); }
    .tower-svg .ts.lit path { stroke: var(--gold-dark) !important; filter: drop-shadow(0 0 4px rgba(255,200,0,.8)); }
    .tower-svg .ts.lit line { stroke: var(--gold-dark) !important; }

    .ranking {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
    }
    .ranking h2 { color: #7C3AED; margin-bottom: 14px; font-size: 1rem; letter-spacing: 2px; text-align: center; }
    .rank-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: .9rem;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-num { width: 28px; font-size: 1.1rem; text-align: center; }
    .rank-name { flex: 1; font-weight: 700; }
    .rank-bar-wrap { flex: 2; }
    .rank-bar { height: 8px; background: #e5e0ff; border-radius: 4px; overflow: hidden; }
    .rank-bar-fill { height: 100%; border-radius: 4px; transition: width .8s ease; }
    .rank-pts { min-width: 60px; text-align: right; color: #7C3AED; font-weight: 700; font-size: .85rem; }

    .refresh-info { text-align: center; color: #6b7280; font-size: .75rem; margin-top: 14px; }
    .countdown { color: #7C3AED; font-weight: 700; }
  </style>
</head>
<body>

<header>
  <h1>🗼 PROCESS EIFFEL TOWER CHALLENGE</h1>
  <p>Host view — auto-refreshes every 10 seconds &nbsp;|&nbsp; <span id="countdown" class="countdown">10</span>s</p>
</header>

<div class="grid" id="teamGrid"></div>

<div class="ranking">
  <h2>LIVE RANKING</h2>
  <div id="rankingList"></div>
</div>
<p class="refresh-info">Last update: <span id="lastUpdate">—</span></p>

<script>
const TOTAL_SUBPROCS = 73;
const MAX_POINTS = 730;
const MEDALS = ['🥇','🥈','🥉'];

let teams = [];

async function fetchTeams() {
  const r = await fetch('/api/teams').catch(() => null);
  if (!r) return;
  teams = await r.json();
  render();
}

function countCompletedProcesses(team, procList) {
  return procList.filter(p => {
    const spIds = p.subprocessos.map(s => s.id);
    return spIds.length > 0 && spIds.every(id => team.completed[id]);
  }).length;
}

function getTowerSectionId(base, num) {
  return base + 'ts' + num;
}

function render() {
  const grid = document.getElementById('teamGrid');
  const sorted = [...teams].sort((a,b) => b.points - a.points);
  const leader = sorted[0];

  /* Initialize grid if empty */
  if (grid.children.length === 0) {
    grid.innerHTML = teams.map(t => {
      const svgId = 't' + t.idx;
      const towerSVG = createTowerSVG(svgId);
      return `<div class="team-card" id="card${t.idx}" style="border-top: 3px solid ${t.color}">
        <span class="rank-badge" id="badge${t.idx}"></span>
        <div class="team-name" style="color:${t.color}">${t.name}</div>
        ${towerSVG}
        <div class="team-pts" id="pts${t.idx}">0</div>
        <div class="progress-wrap">
          <div class="progress-fill" id="fill${t.idx}" style="background:${t.color};width:0%"></div>
        </div>
        <div class="progress-pct" id="pct${t.idx}">0%</div>
      </div>`;
    }).join('');
  }

  /* Load process data from global GAME_DATA if available */
  const procList = (typeof GAME_DATA !== 'undefined' && GAME_DATA.fases) 
    ? GAME_DATA.fases.flatMap(f => f.processos)
    : [];

  teams.forEach(t => {
    const pct = Math.round((t.points / MAX_POINTS) * 100);
    document.getElementById('pts' + t.idx).textContent = t.points + ' pts';
    document.getElementById('fill' + t.idx).style.width = pct + '%';
    document.getElementById('pct' + t.idx).textContent = pct + '%';

    const card = document.getElementById('card' + t.idx);
    card.classList.toggle('leader', leader && t.idx === leader.idx && leader.points > 0);

    /* Update tower sections */
    const completed = procList.length > 0 ? countCompletedProcesses(t, procList) : 0;
    const base = 't' + t.idx;
    for (let i = 1; i <= 22; i++) {
      const g = document.getElementById(base + 'ts' + i);
      if (!g) continue;
      const rank = 23 - i;
      rank <= completed ? g.classList.add('lit') : g.classList.remove('lit');
    }

    /* Rank badge */
    const rank = sorted.findIndex(x => x.idx === t.idx);
    document.getElementById('badge' + t.idx).textContent = MEDALS[rank] || (rank + 1);
  });

  /* Ranking table */
  const rl = document.getElementById('rankingList');
  rl.innerHTML = sorted.map((t, i) => {
    const pct = Math.round((t.points / MAX_POINTS) * 100);
    return `<div class="rank-row">
      <div class="rank-num">${MEDALS[i] || (i+1)}</div>
      <div class="rank-name" style="color:${t.color}">${t.name}</div>
      <div class="rank-bar-wrap"><div class="rank-bar"><div class="rank-bar-fill" style="width:${pct}%;background:${t.color}"></div></div></div>
      <div class="rank-pts">${t.points} pts</div>
    </div>`;
  }).join('');

  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
}

function createTowerSVG(base) {
  /* Base tower structure — all 22 sections */
  const paths = {
    22: `<rect x="5" y="508" width="190" height="8" rx="3"/>
         <rect x="8" y="494" width="26" height="16" rx="2"/><rect x="166" y="494" width="26" height="16" rx="2"/>
         <rect x="58" y="498" width="18" height="12" rx="2"/><rect x="124" y="498" width="18" height="12" rx="2"/>`,
    21: `<path d="M 62 508 Q 100 448 138 508" stroke-width="7" stroke-linecap="round"/><path d="M 10 508 Q 33 468 58 508" stroke-width="5" stroke-linecap="round"/>
         <path d="M 142 508 Q 167 468 190 508" stroke-width="5" stroke-linecap="round"/><line x1="72" y1="488" x2="128" y2="488"/>`,
    20: `<path d="M 21 494 C 14 465 20 445 38 428" stroke-width="8" stroke-linecap="round"/><path d="M 179 494 C 186 465 180 445 162 428" stroke-width="8" stroke-linecap="round"/>
         <path d="M 66 498 C 57 468 55 448 58 428" stroke-width="5" stroke-linecap="round"/><path d="M 134 498 C 143 468 145 448 142 428" stroke-width="5" stroke-linecap="round"/>`,
    19: `<path d="M 38 428 C 28 410 30 395 42 385" stroke-width="8" stroke-linecap="round"/><path d="M 162 428 C 172 410 170 395 158 385" stroke-width="8" stroke-linecap="round"/>
         <path d="M 58 428 C 54 410 54 395 56 385" stroke-width="5" stroke-linecap="round"/><path d="M 142 428 C 146 410 146 395 144 385" stroke-width="5" stroke-linecap="round"/>
         <line x1="32" y1="408" x2="168" y2="408"/>`,
    18: `<rect x="22" y="375" width="156" height="12" rx="3"/><rect x="25" y="379" width="150" height="5" rx="2"/>`,
    17: `<polygon points="42,375 158,375 148,348 52,348"/><line x1="65" y1="375" x2="64" y2="348"/><line x1="100" y1="375" x2="100" y2="348"/><line x1="135" y1="375" x2="136" y2="348"/>`,
    16: `<polygon points="52,348 148,348 140,320 60,320"/><line x1="75" y1="348" x2="74" y2="320"/><line x1="100" y1="348" x2="100" y2="320"/><line x1="125" y1="348" x2="126" y2="320"/>`,
    15: `<polygon points="60,320 140,320 134,294 66,294"/><line x1="78" y1="320" x2="77" y2="294"/><line x1="100" y1="320" x2="100" y2="294"/><line x1="122" y1="320" x2="123" y2="294"/>`,
    14: `<rect x="42" y="284" width="116" height="12" rx="3"/><rect x="45" y="288" width="110" height="5" rx="2"/>`,
    13: `<polygon points="66,284 134,284 128,258 72,258"/><line x1="80" y1="284" x2="79" y2="258"/><line x1="100" y1="284" x2="100" y2="258"/><line x1="120" y1="284" x2="121" y2="258"/>`,
    12: `<polygon points="72,258 128,258 123,232 77,232"/><line x1="84" y1="258" x2="83" y2="232"/><line x1="100" y1="258" x2="100" y2="232"/><line x1="116" y1="258" x2="117" y2="232"/>`,
    11: `<polygon points="77,232 123,232 119,206 81,206"/><line x1="88" y1="232" x2="87" y2="206"/><line x1="100" y1="232" x2="100" y2="206"/><line x1="112" y1="232" x2="113" y2="206"/>`,
    10: `<rect x="62" y="196" width="76" height="12" rx="3"/><rect x="65" y="200" width="70" height="5" rx="2"/>`,
    9: `<polygon points="81,196 119,196 115,172 85,172"/><line x1="90" y1="196" x2="89" y2="172"/><line x1="100" y1="196" x2="100" y2="172"/><line x1="110" y1="196" x2="111" y2="172"/>`,
    8: `<polygon points="85,172 115,172 112,148 88,148"/><line x1="92" y1="172" x2="91" y2="148"/><line x1="100" y1="172" x2="100" y2="148"/><line x1="108" y1="172" x2="109" y2="148"/>`,
    7: `<polygon points="88,148 112,148 110,124 90,124"/><line x1="94" y1="148" x2="93" y2="124"/><line x1="100" y1="148" x2="100" y2="124"/><line x1="106" y1="148" x2="107" y2="124"/>`,
    6: `<rect x="78" y="114" width="44" height="12" rx="3"/><rect x="81" y="118" width="38" height="5" rx="2"/>`,
    5: `<polygon points="90,114 110,114 107,92 93,92"/><line x1="94" y1="114" x2="93" y2="92"/><line x1="100" y1="114" x2="100" y2="92"/><line x1="106" y1="114" x2="107" y2="92"/>`,
    4: `<polygon points="93,92 107,92 105,70 95,70"/><line x1="96" y1="92" x2="95" y2="70"/><line x1="100" y1="92" x2="100" y2="70"/><line x1="104" y1="92" x2="105" y2="70"/>`,
    3: `<polygon points="95,70 105,70 103,54 97,54"/><line x1="97" y1="70" x2="97" y2="54"/><line x1="100" y1="70" x2="100" y2="54"/><line x1="103" y1="70" x2="103" y2="54"/>
         <rect x="92" y="50" width="16" height="6" rx="2"/><rect x="94" y="52" width="12" height="3" rx="1"/>`,
    2: `<rect x="98" y="22" width="4" height="30" rx="1"/><rect x="95" y="36" width="10" height="3" rx="1"/><rect x="96" y="28" width="8" height="2" rx="1"/>`,
    1: `<circle cx="100" cy="18" r="5"/><rect x="98" y="18" width="4" height="6"/>`
  };

  let html = `<svg class="tower-svg" viewBox="0 0 200 520" xmlns="http://www.w3.org/2000/svg">`;
  for (let i = 22; i >= 1; i--) {
    html += `<g class="ts" id="${base}ts${i}">${paths[i]}</g>`;
  }
  html += `</svg>`;
  return html;
}

/* Poll every 10 seconds */
let secs = 10;
setInterval(() => {
  secs--;
  document.getElementById('countdown').textContent = secs;
  if (secs <= 0) {
    secs = 10;
    fetchTeams();
  }
}, 1000);

/* Initial load */
fetchTeams();
</script>

<script src="data.js"></script>
</body>
</html>
